version: '3.8'

services:
  # Off-chain Object Store (MinIO)
  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: tessera-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-tessera_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-tessera_secret_key_12345}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-storage:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO Bucket Auto-Provisioner
  minio-init:
    image: minio/mc:RELEASE.2024-01-16T16-06-34Z
    container_name: tessera-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 $${MINIO_ACCESS_KEY:-tessera_admin} $${MINIO_SECRET_KEY:-tessera_secret_key_12345};
      /usr/bin/mc mb --ignore-existing myminio/tessera-evidence;
      /usr/bin/mc anonymous set download myminio/tessera-evidence;
      exit 0;
      "

  # Hyperledger Fabric World-State Database (CouchDB)
  couchdb:
    image: couchdb:3.3.3
    container_name: tessera-couchdb
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: password
    ports:
      - "5984:5984"
    volumes:
      - couchdb-storage:/opt/couchdb/data

volumes:
  minio-storage:
  couchdb-storage:
